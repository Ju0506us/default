name: Add HACS default integration entry

on:
  push:
    branches:
      - add-battery-status-monitor

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add integration entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("integration")
          text = path.read_text()
          entry = '  "Ju0506us/ha-battery-status-monitor",\n'
          marker = '  "juacas/honor_x3",\n'
          if "Ju0506us/ha-battery-status-monitor" not in text:
              if marker not in text:
                  raise SystemExit("Insertion marker not found")
              text = text.replace(marker, entry + marker, 1)
              path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/add-hacs-entry.yml

      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration .github/workflows/add-hacs-entry.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add ha-battery-status-monitor to integration list"
          git push
