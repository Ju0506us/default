name: Add battery monitor card

on:
  push:
    branches:
      - add-battery-status-monitor-card

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: add-battery-status-monitor-card
          fetch-depth: 0
      - name: Update plugin list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("plugin")
          text = p.read_text()
          needle = '  "jtubb/Pylontech-Battery-Card",\n'
          insert = needle + '  "Ju0506us/ha-battery-status-monitor-card",\n'
          if '"Ju0506us/ha-battery-status-monitor-card"' not in text:
              if needle not in text:
                  raise SystemExit("Insertion point not found")
              text = text.replace(needle, insert, 1)
              p.write_text(text)
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/add-battery-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin .github/workflows/add-battery-card.yml
          git commit -m "Add HA Battery Status Monitor Card"
          git push
